<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 拾帧 FrameSeek 品牌图标：渐变圆角方 + 白色帧格 + 深色播放键
       三个使用位：① 网站 favicon ② 侧边栏 .mark ③ WorkBuddy 连接器卡片（mcp.json x-workbuddy.icon）
       改这个文件后，用 tools/scratch/_logo_datauri.py 重新生成 data URI 再贴到 mcp.json -->
  <defs>
    <linearGradient id="fsg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset=".55" stop-color="#4d9dff"/>
      <stop offset="1" stop-color="#2ec27e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#fsg)"/>
  <rect x="13" y="16" width="38" height="32" rx="7" fill="#ffffff"/>
  <path d="M26.5 26 L37.5 32 L26.5 38 Z" fill="#0f1826"/>
  <circle cx="53" cy="49" r="2.6" fill="#ffffff" opacity=".65"/>
  <circle cx="53" cy="41" r="2.6" fill="#ffffff" opacity=".38"/>
</svg>
